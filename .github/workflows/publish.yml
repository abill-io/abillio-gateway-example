# Every v* tag publishes the image the hosted copy pins
# (ghcr.io/abill-io/abillio-gateway-example:<tag>, and :latest), for amd64
# and arm64. A tag whose tests or typecheck fail publishes nothing.
name: publish image
on:
  push:
    tags: ['v*']
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The image's Node line, not whatever the runner ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # QEMU runs the arm64 half of the build on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/abill-io/abillio-gateway-example:${{ github.ref_name }}
            ghcr.io/abill-io/abillio-gateway-example:latest
